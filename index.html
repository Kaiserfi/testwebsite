<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSRS Stats</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px 20px;
            background: linear-gradient(135deg, #121212 0%, #1e1e1e 50%, #0a0a0a 100%);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .content-box {
            background: linear-gradient(145deg, #1a1a1a, #111111);
            padding: 40px;
            border-radius: 8px;
            text-align: center;
            border: 2px solid #5a0000;
            box-shadow: 0 8px 20px rgba(139, 0, 0, 0.4),
                        inset 0 0 15px rgba(255, 51, 51, 0.05);
            max-width: 800px;
            width: 100%;
            box-sizing: border-box;
        }

        /* Player switcher */
        .player-tabs {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 25px;
        }

        .player-tab {
            background: #151515;
            color: #888;
            border: 1px solid #330000;
            border-radius: 20px;
            padding: 8px 20px;
            font: inherit;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: border-color 0.2s, color 0.2s, background 0.2s;
        }

        .player-tab:hover {
            border-color: #ff3333;
            color: #e0e0e0;
        }

        .player-tab.active {
            background: linear-gradient(145deg, #5a0000, #2a0a0a);
            border-color: #ff1a1a;
            color: #fff;
            box-shadow: 0 0 10px rgba(255, 26, 26, 0.3);
        }

        h1 {
            margin-top: 0;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            background: linear-gradient(to right, #8b0000, #ff1a1a, #8b0000);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.8));
            margin-bottom: 5px;
        }

        p {
            color: #b3b3b3;
            margin-bottom: 10px;
        }

        .meta {
            font-size: 0.85rem;
            color: #777;
            margin-bottom: 25px;
        }

        #loading {
            color: #ff1a1a;
            font-style: italic;
            margin-bottom: 15px;
        }

        .refresh-btn {
            background: #2a0a0a;
            color: #e0e0e0;
            border: 1px solid #8b0000;
            border-radius: 4px;
            padding: 6px 14px;
            margin-left: 8px;
            cursor: pointer;
            font: inherit;
        }
        .refresh-btn:hover { border-color: #ff3333; }
        .refresh-btn:disabled { opacity: 0.5; cursor: default; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 15px;
            transition: opacity 0.2s;
        }

        .stats-grid.fading { opacity: 0.3; }

        .stat-card {
            background: #151515;
            border: 1px solid #330000;
            padding: 15px 10px;
            border-radius: 6px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.6);
            transition: transform 0.2s, border-color 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: #ff3333;
        }

        .skill-name {
            font-size: 0.8rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .skill-level {
            font-size: 1.8rem;
            color: #e0e0e0;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 51, 51, 0.3);
        }

        .skill-xp {
            font-size: 0.75rem;
            color: #999;
            margin-top: 5px;
            letter-spacing: 0.5px;
        }

        .highlight {
            border-color: #8b0000;
            background: linear-gradient(145deg, #2a0a0a, #151515);
        }
    </style>
</head>
<body>

    <div class="content-box">
        <div class="player-tabs" id="player-tabs"></div>

        <h1 id="player-name"></h1>
        <p>Live Server Highscores</p>
        <div class="meta">
            <span id="meta-text"></span>
            <button class="refresh-btn" id="refresh-btn" type="button">Update from hiscores</button>
        </div>

        <div id="loading">Fetching data from Gielinor...</div>
        <div class="stats-grid" id="stats-container"></div>
    </div>

    <script>
        // ===== Add or remove players here =====
        const players = ['IKaiserfi', 'QuilledFiend'];
        // ======================================

        const skills = [
            ["overall", "Overall"], ["attack", "Attack"], ["defence", "Defence"],
            ["strength", "Strength"], ["hitpoints", "Hitpoints"], ["ranged", "Ranged"],
            ["prayer", "Prayer"], ["magic", "Magic"], ["cooking", "Cooking"],
            ["woodcutting", "Woodcutting"], ["fletching", "Fletching"], ["fishing", "Fishing"],
            ["firemaking", "Firemaking"], ["crafting", "Crafting"], ["smithing", "Smithing"],
            ["mining", "Mining"], ["herblore", "Herblore"], ["agility", "Agility"],
            ["thieving", "Thieving"], ["slayer", "Slayer"], ["farming", "Farming"],
            ["runecrafting", "Runecraft"], ["hunter", "Hunter"], ["construction", "Construction"],
            ["sailing", "Sailing"]
        ];
        const highlighted = new Set(["herblore", "smithing"]);

        const tabsEl = document.getElementById('player-tabs');
        const nameEl = document.getElementById('player-name');
        const loadingEl = document.getElementById('loading');
        const container = document.getElementById('stats-container');
        const metaText = document.getElementById('meta-text');
        const refreshBtn = document.getElementById('refresh-btn');

        const cache = {};        // stats already loaded, by player name
        let current = null;      // player currently shown
        let requestId = 0;       // ignores slow responses after you switch players

        const apiUrl = name => `https://api.wiseoldman.net/v2/players/${encodeURIComponent(name)}`;

        // Build the buttons
        players.forEach(name => {
            const btn = document.createElement('button');
            btn.className = 'player-tab';
            btn.type = 'button';
            btn.textContent = name;
            btn.dataset.player = name;
            btn.addEventListener('click', () => showPlayer(name));
            tabsEl.appendChild(btn);
        });

        function setActiveTab(name) {
            tabsEl.querySelectorAll('.player-tab').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.player === name);
            });
        }

        function render(player) {
            const data = player.latestSnapshot && player.latestSnapshot.data;
            if (!data) throw new Error('No stats on record yet');

            container.innerHTML = '';
            for (const [key, label] of skills) {
                const s = data.skills[key];
                if (!s) continue;

                const card = document.createElement('div');
                card.className = 'stat-card' + (highlighted.has(key) ? ' highlight' : '');

                const xp = s.experience >= 0 ? s.experience.toLocaleString() + ' XP' : 'Unranked';
                const level = s.level > 0 ? s.level : '–';

                card.innerHTML = `
                    <div class="skill-name">${label}</div>
                    <div class="skill-level">${level}</div>
                    <div class="skill-xp">${xp}</div>
                `;
                container.appendChild(card);
            }

            const display = player.displayName || current;
            nameEl.textContent = display;
            document.title = `${display}'s Stats`;
            const updated = new Date(player.updatedAt).toLocaleString();
            metaText.textContent = `Combat ${player.combatLevel} · Last updated ${updated}`;
            loadingEl.style.display = 'none';
            container.classList.remove('fading');
        }

        function showError(msg) {
            loadingEl.style.display = 'block';
            loadingEl.innerText = msg;
            container.classList.remove('fading');
        }

        // Switch to a player (uses saved data if we already have it)
        function showPlayer(name) {
            current = name;
            setActiveTab(name);
            nameEl.textContent = name;
            document.title = `${name}'s Stats`;

            // Keep the address in sync so the link can be shared
            try {
                const url = new URL(location.href);
                url.searchParams.set('player', name);
                history.replaceState(null, '', url);
            } catch (e) { /* not supported when opened as a local file in some browsers */ }

            if (cache[name]) {
                render(cache[name]);
                return;
            }

            const myRequest = ++requestId;
            metaText.textContent = '';
            loadingEl.style.display = 'block';
            loadingEl.innerText = 'Fetching data from Gielinor...';
            container.classList.add('fading');

            fetch(apiUrl(name))
                .then(r => {
                    if (r.status === 404) throw new Error('not-tracked');
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.json();
                })
                .then(player => {
                    cache[name] = player;
                    if (myRequest === requestId) render(player);
                })
                .catch(err => {
                    if (myRequest !== requestId) return;
                    if (err.message === 'not-tracked') return updateStats();
                    console.error(err);
                    showError('Error: could not load stats right now. Try again in a minute.');
                });
        }

        // Ask Wise Old Man to pull fresh numbers from the official hiscores
        function updateStats() {
            const name = current;
            refreshBtn.disabled = true;
            refreshBtn.textContent = 'Updating...';

            return fetch(apiUrl(name), { method: 'POST' })
                .then(r => {
                    if (r.status === 429) throw new Error('Updated too recently, wait a minute and try again.');
                    if (!r.ok) throw new Error('Update failed (HTTP ' + r.status + ').');
                    return r.json();
                })
                .then(player => {
                    cache[name] = player;
                    if (current === name) render(player);
                })
                .catch(err => {
                    console.error(err);
                    if (current === name) metaText.textContent = err.message;
                })
                .finally(() => {
                    refreshBtn.disabled = false;
                    refreshBtn.textContent = 'Update from hiscores';
                });
        }

        refreshBtn.addEventListener('click', updateStats);

        // Start on ?player=Name if given, otherwise the first player in the list
        let start = players[0];
        try {
            const p = new URLSearchParams(location.search).get('player');
            if (p) {
                const match = players.find(n => n.toLowerCase() === p.toLowerCase());
                start = match || p;
            }
        } catch (e) { /* keep default */ }
        showPlayer(start);
    </script>

</body>
</html>
