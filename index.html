<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSRS Leaderboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px 16px;
            background: linear-gradient(135deg, #121212 0%, #1e1e1e 50%, #0a0a0a 100%);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .content-box {
            background: linear-gradient(145deg, #1a1a1a, #111111);
            padding: 36px;
            border-radius: 8px;
            text-align: center;
            border: 2px solid #5a0000;
            box-shadow: 0 8px 20px rgba(139, 0, 0, 0.4),
                        inset 0 0 15px rgba(255, 51, 51, 0.05);
            max-width: 800px;
            width: 100%;
            box-sizing: border-box;
        }

        h1 {
            margin: 0 0 5px;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            background: linear-gradient(to right, #8b0000, #ff1a1a, #8b0000);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.8));
        }

        .subtitle {
            color: #b3b3b3;
            margin: 0 0 25px;
        }

        /* ---------- Controls ---------- */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .controls label {
            color: #888;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        select, .btn {
            background: #151515;
            color: #e0e0e0;
            border: 1px solid #5a0000;
            border-radius: 4px;
            padding: 7px 12px;
            font: inherit;
            font-size: 0.9rem;
            cursor: pointer;
        }
        select:hover, .btn:hover { border-color: #ff3333; }
        .btn:disabled { opacity: 0.5; cursor: default; }

                /* Skill icons */
        .skill-icon {
            width: 22px;
            height: 22px;
            object-fit: contain;
            vertical-align: middle;
        }

        .ranked-by {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #e0e0e0;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9rem;
        }

        .skill-picker {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(38px, 1fr));
            gap: 6px;
            max-width: 560px;
            margin: 0 auto 18px;
        }

        .skill-pick {
            background: #151515;
            border: 1px solid #330000;
            border-radius: 6px;
            padding: 6px 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: border-color 0.2s, background 0.2s, transform 0.15s;
        }
        .skill-pick:hover { border-color: #ff3333; transform: translateY(-2px); }
        .skill-pick.active {
            background: linear-gradient(145deg, #5a0000, #2a0a0a);
            border-color: #ff1a1a;
            box-shadow: 0 0 8px rgba(255, 26, 26, 0.35);
        }

        .status {
            font-size: 0.8rem;
            color: #777;
            min-height: 1.2em;
            margin-bottom: 15px;
        }

        /* ---------- Leaderboard ---------- */
        .board {
            text-align: left;
            border: 1px solid #330000;
            border-radius: 6px;
            overflow: hidden;
        }

        .board-head, .board-row {
            display: grid;
            grid-template-columns: 52px 1fr 70px 130px;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
        }

        .board-head {
            background: #0d0d0d;
            color: #777;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #330000;
        }

        .board-row {
            background: #151515;
            border-bottom: 1px solid #221010;
            cursor: pointer;
            transition: background 0.2s;
        }
        .board-row:last-child { border-bottom: none; }
        .board-row:hover { background: #1f1212; }
        .board-row.selected {
            background: linear-gradient(90deg, #2a0a0a, #151515);
            box-shadow: inset 3px 0 0 #ff1a1a;
        }

        .num { text-align: right; }

        .rank {
            font-weight: bold;
            font-size: 1.1rem;
            color: #777;
            text-align: center;
        }

        .medal {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: 0.95rem;
            color: #111;
        }
        .medal.gold   { background: radial-gradient(circle at 35% 35%, #fff3b0, #d4a017 60%, #8a6500); }
        .medal.silver { background: radial-gradient(circle at 35% 35%, #ffffff, #b8b8b8 60%, #6e6e6e); }
        .medal.bronze { background: radial-gradient(circle at 35% 35%, #ffd2a6, #b8733a 60%, #6b3d17); }

        .player-name {
            font-weight: bold;
            color: #e0e0e0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .bar {
            height: 4px;
            background: #2a1515;
            border-radius: 2px;
            margin-top: 6px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #8b0000, #ff1a1a);
            border-radius: 2px;
            transition: width 0.5s ease;
        }

        .level {
            font-size: 1.4rem;
            font-weight: bold;
            color: #e0e0e0;
            text-shadow: 0 0 10px rgba(255, 51, 51, 0.3);
        }

        .xp { font-size: 0.9rem; color: #ccc; }
        .gap { font-size: 0.72rem; color: #8b5555; margin-top: 2px; }
        .gap.leader { color: #d4a017; }

        .muted { color: #666; font-style: italic; }

        /* ---------- Player profile ---------- */
        .profile {
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid #330000;
        }

        .profile h2 {
            margin: 0 0 4px;
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ff3333;
        }

        .profile .meta {
            font-size: 0.85rem;
            color: #777;
            margin-bottom: 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 15px;
        }

        .stat-card {
            background: #151515;
            border: 1px solid #330000;
            padding: 15px 10px;
            border-radius: 6px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.6);
            transition: transform 0.2s, border-color 0.2s;
            cursor: pointer;
        }
        .stat-card:hover {
            transform: translateY(-5px);
            border-color: #ff3333;
        }
        .stat-card.current {
            border-color: #ff1a1a;
            background: linear-gradient(145deg, #2a0a0a, #151515);
        }

        .stat-card .skill-icon {
            display: block;
            margin: 0 auto 6px;
            width: 26px;
            height: 26px;
        }

        .skill-name {
            font-size: 0.8rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        .skill-level {
            font-size: 1.8rem;
            color: #e0e0e0;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 51, 51, 0.3);
        }
        .skill-xp {
            font-size: 0.75rem;
            color: #999;
            margin-top: 5px;
        }

        /* ---------- Phones ---------- */
        @media (max-width: 560px) {
            .content-box { padding: 24px 14px; }
            h1 { font-size: 1.8rem; }
            .board-head, .board-row {
                grid-template-columns: 40px 1fr 52px 96px;
                gap: 8px;
                padding: 10px;
            }
            .level { font-size: 1.15rem; }
            .xp { font-size: 0.8rem; }
        }
    </style>
</head>
<body>

    <div class="content-box">
        <h1 id="board-title"></h1>
        <p class="subtitle">Live Server Highscores</p>
        <div style="margin:-12px 0 20px;font-size:0.85rem"><a href="redrune.html" style="color:#ff3333;text-decoration:none;margin-right:16px">RedRune highscores &rarr;</a><a href="flipping.html" style="color:#ff3333;text-decoration:none">Flipping leaderboard &rarr;</a></div>

                <div class="skill-picker" id="skill-picker"></div>

        <div class="controls">
            <label>Ranked by</label>
            <span class="ranked-by" id="ranked-by"></span>
            <button class="btn" id="update-all" type="button">Update all from hiscores</button>
        </div>
        <div class="status" id="status"></div>

        <div class="board">
            <div class="board-head">
                <div style="text-align:center">#</div>
                <div>Player</div>
                <div class="num">Level</div>
                <div class="num">XP</div>
            </div>
            <div id="board-rows"></div>
        </div>

        <div class="profile" id="profile" hidden>
            <h2 id="profile-name"></h2>
            <div class="meta">
                <span id="profile-meta"></span>
                <button class="btn" id="update-one" type="button" style="margin-left:8px">Update</button>
            </div>
            <div class="stats-grid" id="profile-grid"></div>
        </div>
    </div>

    <script>
        // ===== Edit these =====
        const boardTitle = 'LaidBackCrew Leaderboard';
        const players = [
            'IKaiserfi',
            'Quilledfiend',
            'RezoDS',
            'Hunter Fc',
            '0srsn0ob',
            'DryTrees',
            'Fi Kaiser',
            'IIKaiserfiII',
            'IKaiserfiI',
            'Kaidew',
            'MeanDeaner',
            'Minuit_Shiro',
            'Quilledbeast',
            'Resiakfii',
            'RezoPK',
            'Watisluck',
            'KnightofKree'
        ];
        // ======================

        const skills = [
            ["overall", "Overall"], ["attack", "Attack"], ["defence", "Defence"],
            ["strength", "Strength"], ["hitpoints", "Hitpoints"], ["ranged", "Ranged"],
            ["prayer", "Prayer"], ["magic", "Magic"], ["cooking", "Cooking"],
            ["woodcutting", "Woodcutting"], ["fletching", "Fletching"], ["fishing", "Fishing"],
            ["firemaking", "Firemaking"], ["crafting", "Crafting"], ["smithing", "Smithing"],
            ["mining", "Mining"], ["herblore", "Herblore"], ["agility", "Agility"],
            ["thieving", "Thieving"], ["slayer", "Slayer"], ["farming", "Farming"],
            ["runecrafting", "Runecraft"], ["hunter", "Hunter"], ["construction", "Construction"],
            ["sailing", "Sailing"]
        ];
        const skillLabel = Object.fromEntries(skills);

        const $ = id => document.getElementById(id);
        const apiUrl = name => `https://api.wiseoldman.net/v2/players/${encodeURIComponent(name)}`;
        const compact = new Intl.NumberFormat('en', { notation: 'compact', maximumFractionDigits: 1 });

        // name -> { player } or { error } or { loading: true }
        const state = {};
        players.forEach(n => state[n] = { loading: true });

        let currentSkill = 'overall';
        let selectedPlayer = null;

        $('board-title').textContent = boardTitle;
        document.title = boardTitle;

                // Skill icons, stored in the "icons" folder next to this page
        function iconUrl(key) {
            const file = key === 'overall' ? 'Stats' : skillLabel[key];
            return `icons/${file}_icon.png`;
        }
        function makeIcon(key) {
            const img = document.createElement('img');
            img.className = 'skill-icon';
            img.src = iconUrl(key);
            img.alt = '';
            img.loading = 'lazy';
            img.onerror = () => { img.style.visibility = 'hidden'; };
            return img;
        }

        // Skill picker (icon buttons)
        skills.forEach(([key, label]) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'skill-pick';
            btn.dataset.skill = key;
            btn.title = label;
            btn.setAttribute('aria-label', label);
            btn.appendChild(makeIcon(key));
            btn.addEventListener('click', () => setSkill(key));
            $('skill-picker').appendChild(btn);
        });

        function setSkill(key) {
            currentSkill = key;
            document.querySelectorAll('.skill-pick').forEach(b =>
                b.classList.toggle('active', b.dataset.skill === key));
            const rb = $('ranked-by');
            rb.innerHTML = '';
            rb.append(makeIcon(key), document.createTextNode(skillLabel[key]));
            renderBoard();
            renderProfile();
        }

        function skillOf(name) {
            const p = state[name] && state[name].player;
            const s = p && p.latestSnapshot && p.latestSnapshot.data && p.latestSnapshot.data.skills[currentSkill];
            return s || null;
        }

        // ---------- Leaderboard ----------
        function renderBoard() {
            const rowsEl = $('board-rows');
            rowsEl.innerHTML = '';

            const ranked = players.slice().sort((a, b) => {
                const xa = skillOf(a) ? skillOf(a).experience : -2;
                const xb = skillOf(b) ? skillOf(b).experience : -2;
                return xb - xa;
            });

            const top = skillOf(ranked[0]);
            const topXp = top && top.experience > 0 ? top.experience : 0;

            ranked.forEach((name, i) => {
                const st = state[name];
                const s = skillOf(name);
                const row = document.createElement('div');
                row.className = 'board-row' + (name === selectedPlayer ? ' selected' : '');
                row.addEventListener('click', () => selectPlayer(name));

                // Rank / medal
                const rankEl = document.createElement('div');
                rankEl.className = 'rank';
                if (s && s.experience > 0 && i < 3) {
                    const m = document.createElement('span');
                    m.className = 'medal ' + ['gold', 'silver', 'bronze'][i];
                    m.textContent = i + 1;
                    rankEl.appendChild(m);
                } else {
                    rankEl.textContent = s ? i + 1 : '–';
                }

                // Name + progress bar
                const nameCell = document.createElement('div');
                const nameEl = document.createElement('div');
                nameEl.className = 'player-name';
                nameEl.textContent = name;
                nameCell.appendChild(nameEl);
                if (s) {
                    const bar = document.createElement('div');
                    bar.className = 'bar';
                    const fill = document.createElement('div');
                    fill.className = 'bar-fill';
                    fill.style.width = topXp ? Math.max(0, s.experience) / topXp * 100 + '%' : '0%';
                    bar.appendChild(fill);
                    nameCell.appendChild(bar);
                }

                const levelEl = document.createElement('div');
                levelEl.className = 'num level';
                const xpEl = document.createElement('div');
                xpEl.className = 'num';

                if (s) {
                    levelEl.textContent = s.level > 0 ? s.level : '–';
                    const xpLine = document.createElement('div');
                    xpLine.className = 'xp';
                    xpLine.textContent = s.experience >= 0 ? s.experience.toLocaleString() : 'Unranked';
                    const gapLine = document.createElement('div');
                    if (i === 0 && s.experience > 0) {
                        gapLine.className = 'gap leader';
                        gapLine.textContent = 'Leader';
                    } else if (s.experience >= 0 && topXp) {
                        gapLine.className = 'gap';
                        gapLine.textContent = '−' + compact.format(topXp - s.experience) + ' behind';
                    }
                    xpEl.append(xpLine, gapLine);
                } else {
                    levelEl.textContent = '';
                    xpEl.innerHTML = `<span class="muted">${st.loading ? 'Loading…' : (st.error === 'HTTP 400' || st.error === 'HTTP 404' ? 'Not on hiscores' : 'Couldn’t load')}</span>`;
                }

                row.append(rankEl, nameCell, levelEl, xpEl);
                rowsEl.appendChild(row);
            });
        }

        // ---------- Player profile ----------
        function selectPlayer(name) {
            selectedPlayer = (selectedPlayer === name) ? null : name;  // click again to close
            renderBoard();
            renderProfile();
            if (selectedPlayer) $('profile').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function renderProfile() {
            const box = $('profile');
            const st = selectedPlayer && state[selectedPlayer];
            if (!st || !st.player) { box.hidden = true; return; }
            box.hidden = false;

            const p = st.player;
            $('profile-name').textContent = selectedPlayer;
            $('profile-meta').textContent =
                `Combat ${p.combatLevel} · Last updated ${new Date(p.updatedAt).toLocaleString()}`;

            const grid = $('profile-grid');
            grid.innerHTML = '';
            const data = p.latestSnapshot && p.latestSnapshot.data;
            if (!data) return;

            for (const [key, label] of skills) {
                const s = data.skills[key];
                if (!s) continue;
                const card = document.createElement('div');
                card.className = 'stat-card' + (key === currentSkill ? ' current' : '');
                card.title = `Rank everyone by ${label}`;
                card.addEventListener('click', () => {
                    setSkill(key);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
                card.appendChild(makeIcon(key));
                card.insertAdjacentHTML('beforeend', `
                    <div class="skill-name">${label}</div>
                    <div class="skill-level">${s.level > 0 ? s.level : '–'}</div>
                    <div class="skill-xp">${s.experience >= 0 ? s.experience.toLocaleString() + ' XP' : 'Unranked'}</div>
                `);
                grid.appendChild(card);
            }
        }

        // ---------- Data ----------
        // Wise Old Man allows about 20 requests a minute without an API key, so every
        // request goes through one paced queue and is retried when the API says "slow down".
        const CACHE_KEY = 'lbc-skills-cache';
        const MIN_GAP = 3200;                 // ms between requests (about 18 a minute)
        let lastCall = 0, chain = Promise.resolve();
        const wait = ms => new Promise(res => setTimeout(res, ms));

        function paced(fn) {
            const run = chain.then(async () => {
                const gap = lastCall + MIN_GAP - Date.now();
                if (gap > 0) await wait(gap);
                lastCall = Date.now();
                return fn();
            });
            chain = run.catch(() => {});
            return run;
        }

        async function api(name, method, tries = 4) {
            for (let a = 0; ; a++) {
                let r;
                try { r = await paced(() => fetch(apiUrl(name), { method })); }
                catch (e) { r = null; }                       // network hiccup
                if (r && r.status !== 429 && r.status < 500) return r;
                if (a >= tries) return r || { ok: false, status: 0 };
                if (method === 'POST' && r && r.status === 429) return r;  // "updated too recently"
                await wait(5000 * (a + 1));
            }
        }

        function saveCache() {
            try {
                const out = {};
                players.forEach(n => { if (state[n] && state[n].player) out[n] = state[n].player; });
                localStorage.setItem(CACHE_KEY, JSON.stringify(out));
            } catch (e) {}
        }
        try {
            const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}');
            players.forEach(n => { if (cached[n]) state[n] = { player: cached[n], stale: true }; });
        } catch (e) {}

        function done() { saveCache(); renderBoard(); renderProfile(); }

        async function load(name) {
            const r = await api(name, 'GET');
            if (r.status === 404) {
                try { await update(name); } catch (e) { if (!state[name].player) state[name] = { error: e.message }; }
            } else if (r.ok) {
                state[name] = { player: await r.json() };
            } else if (!state[name].player) {
                state[name] = { error: 'HTTP ' + r.status };   // keep showing old data if we have it
            }
            done();
        }

        async function update(name) {
            const r = await api(name, 'POST');
            if (r.status === 429) throw new Error('rate-limited');
            if (!r.ok) throw new Error('HTTP ' + r.status);
            state[name] = { player: await r.json() };
            done();
        }

        async function updateAll() {
            const btn = $('update-all');
            btn.disabled = true;
            let failed = 0;
            for (let i = 0; i < players.length; i++) {
                const name = players[i];
                $('status').textContent = `Updating ${name} (${i + 1}/${players.length})… about ${Math.ceil((players.length - i) * MIN_GAP / 1000)}s left`;
                try { await update(name); } catch (e) { failed++; console.error(name, e); }
            }
            $('status').textContent = failed
                ? `Done. ${failed} were updated very recently already, so they kept their latest data.`
                : 'All players updated.';
            btn.disabled = false;
        }

        $('update-all').addEventListener('click', updateAll);

        $('update-one').addEventListener('click', () => {
            const name = selectedPlayer;
            if (!name) return;
            const btn = $('update-one');
            btn.disabled = true;
            btn.textContent = 'Updating…';
            update(name)
                .then(() => { $('status').textContent = `${name} updated.`; })
                .catch(err => {
                    $('status').textContent = err.message === 'rate-limited'
                        ? `${name} was updated too recently, try again in a minute.`
                        : `Couldn't update ${name}.`;
                })
                .finally(() => {
                    btn.disabled = false;
                    btn.textContent = 'Update';
                    renderBoard();
                    renderProfile();
                });
        });

        // Start
        setSkill('overall');
        players.reduce((p, n) => p.then(() => load(n)), Promise.resolve());
    </script>

</body>
</html>
