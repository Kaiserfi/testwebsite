<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IKaiserfi's Stats</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px 20px;
            background: linear-gradient(135deg, #121212 0%, #1e1e1e 50%, #0a0a0a 100%);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .content-box {
            background: linear-gradient(145deg, #1a1a1a, #111111);
            padding: 40px;
            border-radius: 8px;
            text-align: center;
            border: 2px solid #5a0000;
            box-shadow: 0 8px 20px rgba(139, 0, 0, 0.4), 
                        inset 0 0 15px rgba(255, 51, 51, 0.05);
            max-width: 800px;
            width: 100%;
        }

        h1 {
            margin-top: 0;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            background: linear-gradient(to right, #8b0000, #ff1a1a, #8b0000);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.8));
            margin-bottom: 5px;
        }

        p {
            color: #b3b3b3;
            margin-bottom: 30px;
        }

        #loading {
            color: #ff1a1a;
            font-style: italic;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 15px;
        }

        .stat-card {
            background: #151515;
            border: 1px solid #330000;
            padding: 15px 10px;
            border-radius: 6px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.6);
            transition: transform 0.2s, border-color 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: #ff3333;
        }

        .skill-name {
            font-size: 0.8rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .skill-level {
            font-size: 1.8rem;
            color: #e0e0e0;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 51, 51, 0.3);
        }

        /* Specialized highlight for preferred training skills */
        .highlight {
            border-color: #8b0000;
            background: linear-gradient(145deg, #2a0a0a, #151515);
        }
    </style>
</head>
<body>

    <div class="content-box">
        <h1>IKaiserfi</h1>
        <p>Live Server Highscores</p>
        
        <div id="loading">Fetching data from Gielinor...</div>
        <div class="stats-grid" id="stats-container"></div>
    </div>

    <script>
        // The OSRS player to look up
        const username = 'IKaiserfi';
        
        // The official OSRS Lite API URL
        const osrsUrl = `https://secure.runescape.com/m=hiscore_oldschool/index_lite.ws?player=${username}`;
        
        // The proxy to bypass browser CORS restrictions
        const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(osrsUrl)}`;

        // The exact order OSRS returns the skills in their API
        const skillsOrder = [
            "Overall", "Attack", "Defence", "Strength", "Hitpoints", "Ranged", 
            "Prayer", "Magic", "Cooking", "Woodcutting", "Fletching", "Fishing", 
            "Firemaking", "Crafting", "Smithing", "Mining", "Herblore", "Agility", 
            "Thieving", "Slayer", "Farming", "Runecraft", "Hunter", "Construction"
        ];

        fetch(proxyUrl)
            .then(response => {
                if (!response.ok) throw new Error('Could not fetch stats');
                return response.text();
            })
            .then(data => {
                // Hide the loading text
                document.getElementById('loading').style.display = 'none';
                
                const container = document.getElementById('stats-container');
                
                // OSRS returns data as a giant block of text separated by new lines
                const lines = data.split('\n');

                // Loop through the first 24 lines to build a card for each skill
                for (let i = 0; i < skillsOrder.length; i++) {
                    const skillData = lines[i].split(',');
                    
                    // The API provides: Rank, Level, XP
                    const level = skillData[1];
                    
                    const card = document.createElement('div');
                    card.className = 'stat-card';
                    
                    // Apply the highlight class to specific skills
                    if (skillsOrder[i] === 'Herblore' || skillsOrder[i] === 'Smithing') {
                        card.classList.add('highlight');
                    }

                    card.innerHTML = `
                        <div class="skill-name">${skillsOrder[i]}</div>
                        <div class="skill-level">${level}</div>
                    `;
                    
                    container.appendChild(card);
                }
            })
            .catch(error => {
                document.getElementById('loading').innerText = 'Error: Could not load stats. The API might be down.';
                console.error(error);
            });
    </script>

</body>
</html>
