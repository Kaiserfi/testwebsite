<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IKaiserfi's Stats</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px 20px;
            background: linear-gradient(135deg, #121212 0%, #1e1e1e 50%, #0a0a0a 100%);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .content-box {
            background: linear-gradient(145deg, #1a1a1a, #111111);
            padding: 40px;
            border-radius: 8px;
            text-align: center;
            border: 2px solid #5a0000;
            box-shadow: 0 8px 20px rgba(139, 0, 0, 0.4),
                        inset 0 0 15px rgba(255, 51, 51, 0.05);
            max-width: 800px;
            width: 100%;
            box-sizing: border-box;
        }

        h1 {
            margin-top: 0;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            background: linear-gradient(to right, #8b0000, #ff1a1a, #8b0000);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.8));
            margin-bottom: 5px;
        }

        p {
            color: #b3b3b3;
            margin-bottom: 10px;
        }

        .meta {
            font-size: 0.85rem;
            color: #777;
            margin-bottom: 25px;
        }

        #loading {
            color: #ff1a1a;
            font-style: italic;
        }

        button {
            background: #2a0a0a;
            color: #e0e0e0;
            border: 1px solid #8b0000;
            border-radius: 4px;
            padding: 6px 14px;
            margin-left: 8px;
            cursor: pointer;
            font: inherit;
        }
        button:hover { border-color: #ff3333; }
        button:disabled { opacity: 0.5; cursor: default; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 15px;
        }

        .stat-card {
            background: #151515;
            border: 1px solid #330000;
            padding: 15px 10px;
            border-radius: 6px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.6);
            transition: transform 0.2s, border-color 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: #ff3333;
        }

        .skill-name {
            font-size: 0.8rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .skill-level {
            font-size: 1.8rem;
            color: #e0e0e0;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 51, 51, 0.3);
        }

        .skill-xp {
            font-size: 0.75rem;
            color: #999;
            margin-top: 5px;
            letter-spacing: 0.5px;
        }

        .highlight {
            border-color: #8b0000;
            background: linear-gradient(145deg, #2a0a0a, #151515);
        }
    </style>
</head>
<body>

    <div class="content-box">
        <h1 id="player-name">IKaiserfi</h1>
        <p>Live Server Highscores</p>
        <div class="meta">
            <span id="meta-text"></span>
            <button id="refresh-btn" type="button">Update from hiscores</button>
        </div>

        <div id="loading">Fetching data from Gielinor...</div>
        <div class="stats-grid" id="stats-container"></div>
    </div>

    <script>
        // Pick the player from the address, e.g. index.html?player=QuilledFiend
        let username = 'IKaiserfi';
        try {
            const p = new URLSearchParams(location.search).get('player');
            if (p && p.trim()) username = p.trim();
        } catch (e) { /* keep default */ }
        document.getElementById('player-name').textContent = username;
        document.title = `${username}'s Stats`;
        const apiUrl = `https://api.wiseoldman.net/v2/players/${encodeURIComponent(username)}`;

        // Display order and labels (keys match Wise Old Man's API)
        const skills = [
            ["overall", "Overall"], ["attack", "Attack"], ["defence", "Defence"],
            ["strength", "Strength"], ["hitpoints", "Hitpoints"], ["ranged", "Ranged"],
            ["prayer", "Prayer"], ["magic", "Magic"], ["cooking", "Cooking"],
            ["woodcutting", "Woodcutting"], ["fletching", "Fletching"], ["fishing", "Fishing"],
            ["firemaking", "Firemaking"], ["crafting", "Crafting"], ["smithing", "Smithing"],
            ["mining", "Mining"], ["herblore", "Herblore"], ["agility", "Agility"],
            ["thieving", "Thieving"], ["slayer", "Slayer"], ["farming", "Farming"],
            ["runecrafting", "Runecraft"], ["hunter", "Hunter"], ["construction", "Construction"],
            ["sailing", "Sailing"]
        ];
        const highlighted = new Set(["herblore", "smithing"]);

        const loadingEl = document.getElementById('loading');
        const container = document.getElementById('stats-container');
        const metaText = document.getElementById('meta-text');
        const refreshBtn = document.getElementById('refresh-btn');

        function render(player) {
            const data = player.latestSnapshot && player.latestSnapshot.data;
            if (!data) throw new Error('No stats on record yet');

            container.innerHTML = '';
            for (const [key, label] of skills) {
                const s = data.skills[key];
                if (!s) continue;

                const card = document.createElement('div');
                card.className = 'stat-card' + (highlighted.has(key) ? ' highlight' : '');

                const xp = s.experience >= 0 ? s.experience.toLocaleString() + ' XP' : 'Unranked';
                const level = s.level > 0 ? s.level : '–';

                card.innerHTML = `
                    <div class="skill-name">${label}</div>
                    <div class="skill-level">${level}</div>
                    <div class="skill-xp">${xp}</div>
                `;
                container.appendChild(card);
            }

            if (player.displayName) {
                document.getElementById('player-name').textContent = player.displayName;
                document.title = `${player.displayName}'s Stats`;
            }
            const updated = new Date(player.updatedAt).toLocaleString();
            metaText.textContent = `Combat ${player.combatLevel} · Last updated ${updated}`;
            loadingEl.style.display = 'none';
        }

        function showError(msg) {
            loadingEl.style.display = 'block';
            loadingEl.innerText = msg;
        }

        // GET: read the latest stored stats (fast, no rate-limit worries)
        function loadStats() {
            return fetch(apiUrl)
                .then(r => {
                    if (r.status === 404) throw new Error('not-tracked');
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.json();
                })
                .then(render)
                .catch(err => {
                    if (err.message === 'not-tracked') {
                        // First visit: ask Wise Old Man to start tracking this player
                        return updateStats();
                    }
                    console.error(err);
                    showError('Error: could not load stats right now. Try again in a minute.');
                });
        }

        // POST: tell Wise Old Man to pull fresh numbers from the official hiscores
        function updateStats() {
            refreshBtn.disabled = true;
            refreshBtn.textContent = 'Updating...';
            return fetch(apiUrl, { method: 'POST' })
                .then(r => {
                    if (r.status === 429) throw new Error('Updated too recently, wait a minute and try again.');
                    if (!r.ok) throw new Error('Update failed (HTTP ' + r.status + ').');
                    return r.json();
                })
                .then(render)
                .catch(err => {
                    console.error(err);
                    metaText.textContent = err.message;
                })
                .finally(() => {
                    refreshBtn.disabled = false;
                    refreshBtn.textContent = 'Update from hiscores';
                });
        }

        refreshBtn.addEventListener('click', updateStats);
        loadStats();
    </script>

</body>
</html>
